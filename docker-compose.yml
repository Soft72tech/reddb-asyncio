services:
  firebird:
    image: firebirdsql/firebird
    restart: always
    environment:
      - FIREBIRD_ROOT_PASSWORD=admin
      - FIREBIRD_USER=admin 
      - FIREBIRD_PASSWORD=admin
      - FIREBIRD_DATABASE=db.fdb
      - FIREBIRD_DATABASE_DEFAULT_CHARSET=UTF8
    volumes:
      - ./data:/var/lib/firebird/data
  test:
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    working_dir: /app
    command: ["uv run /app/main.py"]
    volumes:
      - ./:/app:ro

