volumes:
  red-db:

services:
  red-db:
    image: registry.red-soft.ru/red-database/red-database:5
    environment:
      - SYSDBA_PASSWORD=1
    volumes:
      - red-db:/db
    ports:
      - 3050:3050
    
  pytest:
    pull_policy: never
    build:
      dockerfile: Dockerfile
    command: [pytest, -vvv]
    tty: true
    depends_on:
      red-db:
        condition: service_started
    volumes:
      - .:/project
    environment:
      DATABASE_URL: "firebird://SYSDBA:1@red-db:3050//db/test.fdb"

